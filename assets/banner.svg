<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Tagline Glow Gradient -->
    <linearGradient id="tagline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Radial Lights -->
    <radialGradient id="radial-glow-1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radial-glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card with rounded corners and border -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glow Effects -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#radial-glow-1)" />
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#radial-glow-2)" />

  <!-- Decorative Grid Dots -->
  <g fill="#334155" opacity="0.3">
    <circle cx="50" cy="40" r="1.5" /><circle cx="70" cy="40" r="1.5" /><circle cx="90" cy="40" r="1.5" />
    <circle cx="50" cy="60" r="1.5" /><circle cx="70" cy="60" r="1.5" /><circle cx="90" cy="60" r="1.5" />
    <circle cx="50" cy="80" r="1.5" /><circle cx="70" cy="80" r="1.5" /><circle cx="90" cy="80" r="1.5" />
    
    <circle cx="810" cy="140" r="1.5" /><circle cx="830" cy="140" r="1.5" /><circle cx="850" cy="140" r="1.5" />
    <circle cx="810" cy="160" r="1.5" /><circle cx="830" cy="160" r="1.5" /><circle cx="850" cy="160" r="1.5" />
    <circle cx="810" cy="180" r="1.5" /><circle cx="830" cy="180" r="1.5" /><circle cx="850" cy="180" r="1.5" />
  </g>

  <!-- Content Centered -->
  <!-- Tagline Pill: "JUST ME 🌙" -->
  <g transform="translate(450, 48)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff" letter-spacing="2.5">
      JUST ME 🌙
    </text>
  </g>

  <!-- Name -->
  <text x="450" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="1">
    VICTOR HUGO SANTANA
  </text>

  <!-- Role Subtitle -->
  <text x="450" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="url(#accent-grad)" letter-spacing="1.5">
    FULLSTACK DEVELOPER  •  UI/UX DESIGNER  •  IA &amp; ENGENHARIA AGÊNTICA
  </text>

  <!-- Academic / Location Footnote -->
  <text x="450" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    IFBA Eunápolis &bull; Sistemas &amp; Soluções Digitais de Alta Conversão &bull; Bahia, Brasil
  </text>
</svg>
